services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lecture-notes-rag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lecture_notes}
      POSTGRES_USER: ${POSTGRES_USER:-lecture_notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lecture_notes_dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecture_notes -d lecture_notes"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
